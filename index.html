<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean browser notes app with search, autosave, and local storage.">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <button class="mobile-toggle" type="button" aria-label="Open notes list" aria-expanded="false" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <aside class="sidebar" id="sidebar" aria-label="Notes list">
            <div class="sidebar-header">
                <div>
                    <p class="eyebrow">Workspace</p>
                    <h1>Notes</h1>
                </div>
                <button class="icon-btn mobile-close" type="button" aria-label="Close notes list" onclick="toggleSidebar(false)">x</button>
            </div>

            <label class="search-field" for="searchInput">
                <span aria-hidden="true"></span>
                <input type="search" class="search-input" placeholder="Search notes" id="searchInput" autocomplete="off">
            </label>

            <div class="notes-meta">
                <span id="noteCount">0 notes</span>
                <button class="text-btn" type="button" onclick="createNewNote()">New note</button>
            </div>

            <div class="notes-container" id="notesContainer" aria-live="polite"></div>
        </aside>

        <main class="main-editor">
            <header class="editor-header">
                <div class="title-wrap">
                    <label class="sr-only" for="noteTitleInput">Note title</label>
                    <input type="text" class="note-title-input" placeholder="Untitled note" id="noteTitleInput">
                    <div class="status-row">
                        <span id="saveStatus">All changes saved</span>
                        <span id="wordCount">0 words</span>
                    </div>
                </div>

                <div class="editor-actions" aria-label="Note actions">
                    <button class="action-btn btn-primary" type="button" onclick="createNewNote()">New</button>
                    <button class="action-btn btn-secondary" type="button" onclick="saveNote(true)">Save</button>
                    <button class="action-btn btn-danger" type="button" onclick="deleteNote()">Delete</button>
                </div>
            </header>

            <section class="editor-content">
                <div class="empty-state" id="emptyState">
                    <div class="empty-mark" aria-hidden="true">N</div>
                    <h2>Select a note</h2>
                    <p>Choose a note from the list or create a new one to start writing.</p>
                    <button class="action-btn btn-primary" type="button" onclick="createNewNote()">Create note</button>
                </div>

                <label class="sr-only" for="noteContent">Note content</label>
                <textarea class="note-content" id="noteContent" placeholder="Start writing..." spellcheck="true"></textarea>
            </section>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
</body>
</html>
